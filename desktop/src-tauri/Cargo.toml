[package]
name = "dax-desktop"
version = "0.1.0"
description = "Desktop client for the Dax personal assistant"
authors = ["Dax"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 convention: the app lives in a lib so mobile targets can reuse it.
name = "dax_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to minor per PLAN.md 11.2 — Tauri crates move together and a stray
# patch bump across the tauri/tauri-build boundary breaks codegen.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[features]
# Used by the Tauri CLI for `tauri dev`.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
