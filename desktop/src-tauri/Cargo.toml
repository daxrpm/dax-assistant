[package]
name = "dax-desktop"
version = "0.3.2"
description = "Desktop client for the Dax personal assistant"
authors = ["Dax"]
license = "MIT"
homepage = "https://github.com/daxrpm/dax-assistant"
repository = "https://github.com/daxrpm/dax-assistant"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 convention: the app lives in a lib so mobile targets can reuse it.
name = "dax_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to minor per PLAN.md 11.2 — Tauri crates move together and a stray
# patch bump across the tauri/tauri-build boundary breaks codegen.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system"] }
tokio = { version = "1", features = ["fs", "macros", "process", "sync", "time"] }
url = "2"

[features]
# Used by the Tauri CLI for `tauri dev`.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
