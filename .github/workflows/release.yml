name: Tagged Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-attest:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Check Android signing secrets
        id: android
        env:
          KEYSTORE_BASE64: ${{ secrets.DAX_ANDROID_KEYSTORE_BASE64 }}
        run: echo "enabled=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.android.outputs.enabled == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - if: steps.android.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - if: steps.android.outputs.enabled == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.android.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.11.1
      - name: Materialize Android signing key
        if: steps.android.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DAX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dax-release.jks"
          chmod 600 "$RUNNER_TEMP/dax-release.jks"
      - name: Build coordinated release
        env:
          DAX_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dax-release.jks
          DAX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DAX_ANDROID_KEYSTORE_PASSWORD }}
          DAX_ANDROID_KEY_ALIAS: ${{ secrets.DAX_ANDROID_KEY_ALIAS }}
          DAX_ANDROID_KEY_PASSWORD: ${{ secrets.DAX_ANDROID_KEY_PASSWORD }}
          DAX_ANDROID_CERT_SHA256: ${{ secrets.DAX_ANDROID_CERT_SHA256 }}
          GRADLE: gradle
        run: python3 scripts/release.py build ${{ steps.android.outputs.enabled == 'true' && ' ' || '--skip-android' }}
      - run: sha256sum --check SHA256SUMS
        working-directory: dist/release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dax-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dax-${{ github.ref_name }}
          path: dist/release
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes --title "Dax $GITHUB_REF_NAME"
